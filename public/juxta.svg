<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Left Pill Gradient (Indigo to Blue-Teal) -->
    <linearGradient id="j-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <!-- Right Pill Gradient (Pink to Rose-Orange) -->
    <linearGradient id="j-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <!-- Subtle Inner Glow/Highlight -->
    <linearGradient id="j-grad-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Left Pill (Original/Before) - Elevated -->
  <rect x="100" y="50" width="130" height="340" rx="65" fill="url(#j-grad-1)" />
  <!-- Inner Glow for Left Pill -->
  <rect x="110" y="60" width="110" height="150" rx="55" fill="url(#j-grad-glow)" />

  <!-- Right Pill (Changed/After) - Offset downwards representing shift/difference -->
  <rect x="282" y="122" width="130" height="340" rx="65" fill="url(#j-grad-2)" />
  <!-- Inner Glow for Right Pill -->
  <rect x="292" y="132" width="110" height="150" rx="55" fill="url(#j-grad-glow)" />
  
  <!-- Center Comparison Node -->
  <circle cx="256" cy="256" r="36" fill="#0f172a" />
  <!-- Inner White Circle -->
  <circle cx="256" cy="256" r="22" fill="#ffffff" />
  <!-- Horizontal comparison line indicator inside inner circle -->
  <path d="M246 256h20" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
</svg>
